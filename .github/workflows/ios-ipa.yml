name: build-ios-ipa

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen 2>&1 | tee xcodegen-brew.log

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate 2>&1 | tee xcodegen.log

      - name: Build unsigned app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ShijuanGongfang.xcodeproj \
            -scheme ShijuanGongfang \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package ipa
        working-directory: ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry 试卷工坊-unsigned.ipa Payload
          ls -lh 试卷工坊-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: shijuan-gongfang-unsigned-ipa
          path: ios/试卷工坊-unsigned.ipa
          if-no-files-found: error

      - name: Report failure to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          body=/tmp/ci-body.md
          {
            echo "提交：${{ github.sha }}"
            echo "事件：${{ github.event_name }}"
            echo
            echo '### xcodegen-brew 尾部'
            echo '```'
            tail -n 60 xcodegen-brew.log 2>/dev/null
            echo '```'
            echo '### xcodegen 尾部'
            echo '```'
            tail -n 80 ios/xcodegen.log 2>/dev/null
            echo '```'
            echo '### xcodebuild 尾部'
            echo '```'
            tail -n 300 ios/build.log 2>/dev/null
            echo '```'
          } > "$body"
          gh issue create --repo "${{ github.repository }}" \
            --title "CI 失败 ${{ github.sha }}" \
            --body-file "$body"

      - name: Report success to issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh issue create --repo "${{ github.repository }}" \
            --title "CI 成功 ${{ github.sha }}" \
            --body "macOS 构建通过，ipa 见本次 run 的 artifact：shijuan-gongfang-unsigned-ipa"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/试卷工坊-unsigned.ipa
