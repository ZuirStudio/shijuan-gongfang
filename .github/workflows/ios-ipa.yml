name: build-ios-ipa

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen 2>&1 | tee xcodegen-brew.log

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate 2>&1 | tee xcodegen.log

      - name: Build unsigned app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ShijuanGongfang.xcodeproj \
            -scheme ShijuanGongfang \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package ipa
        working-directory: ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry 试卷工坊-unsigned.ipa Payload
          ls -lh 试卷工坊-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: shijuan-gongfang-unsigned-ipa
          path: ios/试卷工坊-unsigned.ipa
          if-no-files-found: error

      - name: Publish CI log to branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          mkdir -p ci-logs
          echo "$JOB_STATUS" > ci-logs/status.txt
          cp xcodegen-brew.log ci-logs/ 2>/dev/null
          cp ios/xcodegen.log ci-logs/ 2>/dev/null
          cp ios/build.log ci-logs/ 2>/dev/null
          git config user.name "ci-bot"
          git config user.email "ci@local"
          git checkout -b ci-logs
          git add -f ci-logs
          git commit -m "ci log $JOB_STATUS"
          git push -f origin ci-logs

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/试卷工坊-unsigned.ipa
