name: ShijuanGongfang
options:
  bundleIdPrefix: com.shijuan
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  ShijuanGongfang:
    type: application
    platform: iOS
    sources:
      - path: ShijuanGongfang
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shijuan.gongfang
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: ShijuanGongfang/Info.plist
      properties:
        CFBundleDisplayName: 试卷工坊
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: 拍摄试卷用于识别
        NSPhotoLibraryUsageDescription: 从相册选择试卷图片
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: Image
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image

schemes:
  ShijuanGongfang:
    build:
      targets:
        ShijuanGongfang: all
    run:
      config: Release
    archive:
      config: Release
